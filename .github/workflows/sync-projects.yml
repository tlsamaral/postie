name: Sync Target Projects

on:
  schedule:
    - cron: '0 3 * * *' # Executa diariamente às 03:00 UTC
  workflow_dispatch:    # Permite execução manual pelo console do GitHub Actions

jobs:
  sync:
    name: Discover & Update Projects Catalog
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Projects Sync Script
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.PAT_GITHUB || secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          TARGET_TOPIC: postie-target
        run: pnpm sync:projects

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(catalog): auto-sync target projects from github [skip ci]"
          file_pattern: "src/config/projects.catalog.json"
